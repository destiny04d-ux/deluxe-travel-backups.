name: Daily Neon backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *' # About 02:17 in Africa/Lagos; GitHub can delay scheduled jobs.

permissions:
  contents: read

concurrency:
  group: deluxe-travel-live-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_DATABASE: deluxe_travel_live
      EXPECTED_HOST: ep-odd-boat-bfu600w6.c-5.us-west-2.aws.neon.tech
      POSTGRES_IMAGE: postgres:18-bookworm
      MAX_BACKUP_MIB: '25'
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow from the repository's default branch."
            exit 1
          fi

      - name: Get the backup scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Require the private encryption key and encryption tools
        env:
          NEON_BACKUP_ENCRYPTION_KEY: ${{ secrets.NEON_BACKUP_ENCRYPTION_KEY }}
        run: node scripts/encrypt-backup.mjs --check-config

      - name: Get the PostgreSQL 18 client image
        run: docker pull "$POSTGRES_IMAGE"

      - name: Export and validate the database backup
        env:
          NEON_BACKUP_DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
        run: node scripts/backup.mjs

      - name: Test recovery in an isolated temporary database
        run: node scripts/restore-check.mjs

      - name: Encrypt and verify the backup bundle
        env:
          NEON_BACKUP_ENCRYPTION_KEY: ${{ secrets.NEON_BACKUP_ENCRYPTION_KEY }}
        run: node scripts/encrypt-backup.mjs

      - name: Store only the encrypted backup for 14 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deluxe-neon-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/neon-backup-encrypted/deluxe-travel-live.tar.gpg
            ${{ runner.temp }}/neon-backup-encrypted/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Remove temporary plaintext backup files
        if: ${{ always() }}
        run: |
          node --input-type=module <<'NODE'
          import { rm } from 'node:fs/promises';
          import path from 'node:path';
          const temporary = process.env.RUNNER_TEMP;
          if (!temporary || !path.isAbsolute(temporary)) process.exit(1);
          await rm(path.join(temporary, 'neon-backup-output'), { recursive: true, force: true });
          NODE
